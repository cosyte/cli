name: Release

# Thin caller of the shared release pipeline: Changesets -> npm publish through npm trusted
# publishing (OIDC, with provenance; the publish uses no npm token) -> docs artifacts -> GitHub
# release -> repository_dispatch to cosyte/docs. Uses the DOCS_REPO_DISPATCH_TOKEN and
# RELEASE_PR_TOKEN secrets (passed via `secrets: inherit`), the second so the "Version Packages"
# pull request it opens runs its checks. The trusted publisher registered for this package on
# npmjs.com names this repository, this file (`release.yml`) and the `release` environment, so
# renaming the file or the environment stops every publish.
#
# ▶ THE "Version Packages" PR IS AUTHORED THROUGH RELEASE_PR_TOKEN, so its checks run as they do on
# any pull request and the `ci-required-checks` ruleset (`bypass_actors: []`) gates it like one. It
# used to be opened as `github-actions[bot]` with the default `GITHUB_TOKEN`, which starts no
# workflow runs, so it arrived with ZERO check runs and needed a pushed commit before it could merge.
# If one ever arrives with no checks, look at that token first. Adding a bypass actor stays
# DELIBERATELY REJECTED: it would let a human merge a red PR on a published healthcare package.

on:
  push:
    branches: [main]

# Read-only by default: the release job below grants itself the writes the shared pipeline needs.
permissions:
  contents: read

jobs:
  # ▶ THE GATE THE PUBLISH DEPENDS ON. `@cosyte/cli@0.0.1` and `0.0.2` are on the registry
  # uninstallable forever, and the check that would have refused both is `npm install` of the packed
  # tarball FROM A DIRECTORY OUTSIDE THIS REPO. Until this job existed that check was a sentence in a
  # human checklist, and the shared pipeline's own install check runs AFTER `changesets/action` has
  # published, so it can only report a dead version, never prevent one. `ci / prepublish` does ask
  # the same question early, on the Version Packages pull request too, but it is not in this
  # workflow's dependency graph, so on its own it does not gate a publish.
  #
  # It runs on every push to `main`, which includes the push that opens or updates the "Version
  # Packages" PR. That is deliberate. DO NOT make it skippable, and do not add an `if:` to `release`:
  # `needs:` plus no condition is the whole mechanism by which a red or skipped gate stops the
  # publish. `pnpm build` runs first because `files` ships `dist`, and a tarball packed without it
  # carries no `cosyte` at all, which this gate reports as a packaging defect.
  #
  # NEVER ADD `release / install-gate` TO THE `ci-required-checks` RULESET. Like `release / release`
  # it never runs on `pull_request`, and a required context nothing emits leaves every PR pending and
  # unmergeable forever. What makes this gate binding is `needs:` inside this file, not the ruleset.
  install-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # NO `version:` INPUT, DELIBERATELY: `pnpm/action-setup` must resolve exactly one version, from
      # `package.json`'s `packageManager` key and nowhere else. Passing both is a hard error that
      # fails setup before anything installs. Same reasoning as `.github/workflows/fuzz.yml`.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/release-install-gate.mjs

  release:
    needs: install-gate
    # Required. The repo default for GITHUB_TOKEN is `contents: read`, and a called workflow can only
    # downgrade the caller's token, never escalate it, so without this the shared pipeline's
    # `contents/id-token/pull-requests: write` is an escalation and GitHub rejects the whole workflow
    # at startup (1s, no jobs, no logs).
    permissions:
      actions: read # the shared workflow reads this caller's environment protection with it
      contents: write # create tags / the GitHub release
      id-token: write # npm provenance
      pull-requests: write # open the "Version Packages" PR
    uses: cosyte/.github/.github/workflows/release.yml@498c7c13c8869bf11b67fa8324684ec2dc691ec6 # workflows-2026-11-07-498c7c13c886
    with:
      package-name: "@cosyte/cli"
    secrets: inherit
