name: Release

# Thin caller of the shared release pipeline: Changesets -> npm publish (provenance auto-enables when
# this repo is public) -> docs artifacts -> GitHub release -> repository_dispatch to cosyte/docs.
# Requires the NPM_TOKEN and DOCS_REPO_DISPATCH_TOKEN secrets (passed via `secrets: inherit`).
#
# ▶ KNOWN TRAP, documented rather than bypassed. The `ci-required-checks` ruleset on this repo
# requires four contexts with `bypass_actors: []`. Changesets opens the "Version Packages" PR as
# `github-actions[bot]` using the default `GITHUB_TOKEN`, and GitHub does not start workflow runs
# for events raised by that token, so that PR arrives with ZERO check runs. Four required contexts
# that never arrive are PENDING, not failing, and with no bypass actors nobody, including an admin,
# can merge past them. The escape, done last and immediately before merging, is one commit onto
# `changeset-release/main`, which raises a normal `pull_request` event and produces all four
# contexts:
#
#   gh pr checkout <n> && git commit --allow-empty -m "chore: run CI on the version PR" && git push
#
# Adding a bypass actor would also clear it and is DELIBERATELY REJECTED: it would let a human merge
# a red PR on a published healthcare package. The durable fix is to author the Version PR with a PAT
# in the shared `cosyte/.github` release workflow, which is tracked upstream, not here.

on:
  push:
    branches: [main]

jobs:
  release:
    # Required. The repo default for GITHUB_TOKEN is `contents: read`, and a called workflow can only
    # downgrade the caller's token, never escalate it, so without this the shared pipeline's
    # `contents/id-token/pull-requests: write` is an escalation and GitHub rejects the whole workflow
    # at startup (1s, no jobs, no logs).
    permissions:
      actions: read # the shared workflow reads this caller's environment protection with it
      contents: write # create tags / the GitHub release
      id-token: write # npm provenance
      pull-requests: write # open the "Version Packages" PR
    uses: cosyte/.github/.github/workflows/release.yml@main
    with:
      package-name: "@cosyte/cli"
    secrets: inherit
