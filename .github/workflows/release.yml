name: Release

# Thin caller of the shared release pipeline: Changesets -> npm publish (provenance auto-enables when
# this repo is public) -> docs artifacts -> GitHub release -> repository_dispatch to cosyte/docs.
# Requires the NPM_TOKEN and DOCS_REPO_DISPATCH_TOKEN secrets (passed via `secrets: inherit`).
#
# ▶ KNOWN TRAP, documented rather than bypassed. The `ci-required-checks` ruleset on this repo
# requires four contexts with `bypass_actors: []`. Changesets opens the "Version Packages" PR as
# `github-actions[bot]` using the default `GITHUB_TOKEN`, and GitHub does not start workflow runs
# for events raised by that token, so that PR arrives with ZERO check runs. Four required contexts
# that never arrive are PENDING, not failing, and with no bypass actors nobody, including an admin,
# can merge past them. The escape, done last and immediately before merging, is one commit onto
# `changeset-release/main`, which raises a normal `pull_request` event and produces all four
# contexts:
#
#   gh pr checkout <n> && git commit --allow-empty -m "chore: run CI on the version PR" && git push
#
# Adding a bypass actor would also clear it and is DELIBERATELY REJECTED: it would let a human merge
# a red PR on a published healthcare package. The durable fix is to author the Version PR with a PAT
# in the shared `cosyte/.github` release workflow, which is tracked upstream, not here.

on:
  push:
    branches: [main]

jobs:
  # ▶ THE GATE THE PUBLISH DEPENDS ON. `@cosyte/cli@0.0.1` and `0.0.2` are on the registry
  # uninstallable forever, and the check that would have refused both is `npm install` of the packed
  # tarball FROM A DIRECTORY OUTSIDE THIS REPO. Until this job existed that check was a sentence in a
  # human checklist, and the shared pipeline's own install check runs AFTER `changesets/action` has
  # published, so it can only report a dead version, never prevent one. `ci / prepublish` does ask
  # the same question early, but it is not in this workflow's dependency graph and the merge that
  # publishes arrives with zero check runs (the GITHUB_TOKEN trap above), so it does not gate a
  # publish either.
  #
  # It runs on every push to `main`, which includes the push that opens or updates the "Version
  # Packages" PR. That is deliberate. DO NOT make it skippable, and do not add an `if:` to `release`:
  # `needs:` plus no condition is the whole mechanism by which a red or skipped gate stops the
  # publish. `pnpm build` runs first because `files` ships `dist`, and a tarball packed without it
  # carries no `cosyte` at all, which this gate reports as a packaging defect.
  #
  # NEVER ADD `release / install-gate` TO THE `ci-required-checks` RULESET. Like `release / release`
  # it never runs on `pull_request`, and a required context nothing emits leaves every PR pending and
  # unmergeable forever. What makes this gate binding is `needs:` inside this file, not the ruleset.
  install-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # NO `version:` INPUT, DELIBERATELY: `pnpm/action-setup` must resolve exactly one version, from
      # `package.json`'s `packageManager` key and nowhere else. Passing both is a hard error that
      # fails setup before anything installs. Same reasoning as `.github/workflows/fuzz.yml`.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/release-install-gate.mjs

  release:
    needs: install-gate
    # Required. The repo default for GITHUB_TOKEN is `contents: read`, and a called workflow can only
    # downgrade the caller's token, never escalate it, so without this the shared pipeline's
    # `contents/id-token/pull-requests: write` is an escalation and GitHub rejects the whole workflow
    # at startup (1s, no jobs, no logs).
    permissions:
      actions: read # the shared workflow reads this caller's environment protection with it
      contents: write # create tags / the GitHub release
      id-token: write # npm provenance
      pull-requests: write # open the "Version Packages" PR
    uses: cosyte/.github/.github/workflows/release.yml@main
    with:
      package-name: "@cosyte/cli"
    secrets: inherit
