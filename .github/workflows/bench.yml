name: Bench

# A reading of this build on a GitHub-hosted runner, from bench/cli.bench.mjs: throughput and latency
# p50/p95/p99 of the `cosyte` command on every shape and size it reads, each invocation a fresh
# process; process start; and the in-process autodetection with its allocations, peak heap and a
# long run for leaks, beside the cold import of the built entry with every file it loads and its
# gzip size. Then the profile (bench/profile.mjs): the cold import of every package the command
# loads, the memory of one whole invocation on each large input, throughput from each shape's
# smallest size to its largest, allocations and a long run of the in-process command, and a CPU and
# a sampled heap profile of the hottest paths, with the budgets read from them.
#
# On demand, and on a push to any branch but main that changes the bench, the scaling gate or this
# file, so a change to what is measured is measured where it will be read. ADVISORY: it fails only
# when it cannot measure (a suite that does not load, a process that dies, a results file that does
# not match the schema), never on a number, and it is never a required check. The numbers are kept
# as artifacts and shown in each job's summary.
#
# One reading job per group of shapes, side by side, so the reading finishes inside a pull request's
# wait. Jobs on different runners are not compared with each other; each reading names the machine
# it ran on.

on:
  workflow_dispatch: {}
  push:
    branches-ignore: [main]
    paths:
      - "bench/**"
      - "test/perf/**"
      - ".github/workflows/bench.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reading:
    name: reading (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [process, hl7, fhir, x12, astm, ncpdp, ccda, dicom]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # The lowest Node line the package supports, the one the bench-compare job runs on.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Read ${{ matrix.group }}
        env:
          GROUP: ${{ matrix.group }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bench-results
          # The process group is the in-process autodetection, with its memory and the cold import
          # of the built entry, and process start. Every other group is the command run as a
          # process on that group's shapes, whose memory the measuring process cannot see: the
          # profile job reads it.
          if [ "${GROUP}" = "process" ]; then
            flags=(--only "detectFormat" --only "cosyte --version")
          else
            mapfile -t names < <(node bench/names.mjs "${GROUP}")
            flags=(--no-memory --no-import)
            for name in "${names[@]}"; do flags+=(--only "${name}"); done
          fi
          status=0
          pnpm exec cosyte-bench run --suite bench/cli.bench.mjs --target dist/index.mjs \
            --commit "${COMMIT}" "${flags[@]}" \
            --out "bench-results/reading-${GROUP}.json" \
            --summary "bench-results/reading-${GROUP}.md" || status=$?
          if [ -f "bench-results/reading-${GROUP}.md" ]; then
            cat "bench-results/reading-${GROUP}.md" >> "${GITHUB_STEP_SUMMARY}"
          fi
          # Exit 2 with a results file is a measure the reading skipped, named in it with its typed
          # reason (a warmup that did not settle, an allocation window that always collected): a
          # skip is reported, never read as a number. Anything else is a reading that failed.
          if [ "${status}" -eq 2 ] && [ -f "bench-results/reading-${GROUP}.json" ]; then
            echo "::notice::bench reading ${GROUP}: a measure was skipped; its reason is in the results"
          elif [ "${status}" -ne 0 ]; then
            exit "${status}"
          fi
          pnpm exec cosyte-bench check "bench-results/reading-${GROUP}.json"
      - name: Keep the reading
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-reading-${{ matrix.group }}
          path: bench-results/
          if-no-files-found: warn
          retention-days: 30

  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Profile the command
        shell: bash
        run: |
          set -euo pipefail
          pnpm bench:profile --out bench-results/profile
          cat bench-results/profile/profile.md >> "${GITHUB_STEP_SUMMARY}"
      - name: Keep the profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-profile
          path: bench-results/profile/
          if-no-files-found: warn
          retention-days: 30

  scaling-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:perf
