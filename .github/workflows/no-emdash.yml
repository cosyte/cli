name: Em-dash gate

# The brand rule (ST8): no em dash (U+2014) and no en dash (U+2013) on any Cosyte surface, commit
# messages included. cli was not clean when this landed (2026-07-28: 659 occurrences in 87 of 124
# tracked files, the npm description among them), and the change that added the gate cleared them.
#
# The gate is the shared one (ST34): `pnpm check:no-emdash` runs `cosyte-no-emdash` from
# @cosyte/script-utils, which matches the characters and every encoded form of them, in tracked
# files and in their names. What this repository leaves out, and why, is in
# `scripts/check-no-emdash.exclude`, which the gate reads for itself: the nine vendored tarballs,
# one of which carries the dash's three bytes by DEFLATE coincidence.
#
# TWO CONTEXTS, NOT ONE, AND THE JOB ID IS LOAD-BEARING. A called job's check run is named
# `<caller job id> / <inner job id>`, so the job id `no-emdash` below publishes
# `no-emdash / tracked-files` and `no-emdash / messages`. The `ci-required-checks` ruleset requires
# `no-emdash / tracked-files`, so never rename the job. `messages` reads the pull request's title,
# body and commits and is deliberately NOT required: Dependabot composes some bodies from upstream
# release notes, dashes included.
#
# WHY A SEPARATE WORKFLOW, and not a job in ci.yml: the trigger. The message half needs the
# `edited` activity type, because with squash merges the title and body ARE the commit message
# that lands, and re-running the whole CI ladder for a retitled pull request costs far more.
#
# The installing form of the shared gate, because the gate lives in node_modules: it installs from
# the committed lockfile before it scans, and the contexts are the same as the plain form's.
# Nothing here may continue past a failure.
#
# Run either half locally: `pnpm check:no-emdash`, and
# `pnpm check:no-emdash --stdin pr < body.md` for a title, body or commit message.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` is deliberate and load-bearing. See the note above.
    types: [opened, synchronize, reopened, edited]

# No concurrency group. A push and a title or body edit can arrive together (Dependabot does both),
# and a run a group cancels, even a queued one under `cancel-in-progress: false`, can count as a
# failed required check and block the merge until someone re-runs it. Each run takes seconds, so
# every one finishes and the newest result stands.

permissions:
  contents: read

jobs:
  # The check-run context prefix. See the note above before touching this id.
  no-emdash:
    # A published reference (ST37): a `workflows-*` release of cosyte/.github. Those releases
    # are immutable, so the tag is locked to one commit, and every caller in this repository
    # moves to the next reference together. The installing form: the gate lives in node_modules.
    uses: cosyte/.github/.github/workflows/gate-no-emdash-install.yml@c0db8d8e5927269820de4401b3b5ad6141854b76 # workflows-2026-11-08-c0db8d8e5927
    # No more than the scan needs. A called workflow's GITHUB_TOKEN can only be
    # downgraded by its caller, and this gate reads the tree and nothing else.
    permissions:
      contents: read
