name: Fuzz

# Nightly extended fuzz of the CLI's two input boundaries: the terminal (`run`, over the argv + stdin
# byte stream) and the agent surface (`dispatchTool`, over a tool name + arguments). The same property
# suite runs in every CI at a lower case count; this job scales it up (CLI_FUZZ_RUNS) so rare
# degeneracies get more chances to surface off the PR critical path. Self-contained by design: fuzzing
# is an extra, scheduled surface, not one of the shared CI gates.

on:
  schedule:
    - cron: "23 4 * * *" # nightly, 04:23 UTC
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLI_FUZZ_RUNS: "25000"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # NO `version:` INPUT, DELIBERATELY. This step passes no version at all so
      # `pnpm/action-setup` resolves exactly one, from `package.json`'s
      # `packageManager` key and nowhere else. Supplying both is
      # not a redundancy the action tolerates: it is a hard error
      # ("Multiple versions of pnpm specified", ERR_PNPM_BAD_PM_VERSION) that
      # fails setup before a runner ever installs anything, which is what held
      # this workflow red on every scheduled run from 2026-08-17 to 2026-08-30
      # while `CI` stayed green (every other workflow here delegates to the
      # shared reusable pipeline and never calls this action directly).
      # `packageManager` is the manifest's declaration and the version that must
      # win, so if the two ever disagree again, change THIS file: never edit
      # `packageManager` to match a workflow.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:fuzz
