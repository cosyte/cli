name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # The nightly run on main, 05:39 UTC. An odd minute: GitHub delays scheduled runs at the start of every hour.
    - cron: "39 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ┌──────────────────────────────────────────────────────────────────────────────────────────────────┐
  # │ A REQUIRED JOB GATES ALL OF ITS STEPS. The `ci-required-checks` ruleset on this repo requires    │
  # │ four of the five contexts this caller emits: `ci / verify (22, ubuntu-latest)`, `ci / verify     │
  # │ (24, ubuntu-latest)`, `ci / prepublish` and `ci / actionlint`; `ci / verify (26, ubuntu-latest)` │
  # │ is the fifth, not yet required (the matrix note below). Every gate the shared pipeline runs      │
  # │ (typecheck, lint, format:check, PHI scan, test, gating coverage, build, attw, dual ESM/CJS       │
  # │ smoke) is a STEP inside `verify`, and is required only because that job is. Promote any one of   │
  # │ them to its own job and it is silently NO LONGER REQUIRED: the ruleset names contexts, the new   │
  # │ context is not in it, and nothing anywhere errors or warns. If you split a step out, add its     │
  # │ context to the ruleset in the same change.                                                       │
  # │                                                                                                  │
  # │ AND THE HAZARD IS NOT ONLY A LOCAL SPLIT: THE CALLED WORKFLOW CAN GROW A JOB UPSTREAM. The       │
  # │ `uses:` below names a published reference, so a job added upstream reaches this repository only  │
  # │ when that reference moves, in a commit here, and it then emits a new `ci / <job>` context that   │
  # │ arrives NOT REQUIRED: a red X that does not block a merge. That is not hypothetical.             │
  # │ `prepublish` arrived exactly that way on 2026-08-05, while this caller still tracked `@main`,    │
  # │ and was unrequired here until it was measured off a real check run and added. A `ci / *` context │
  # │ you do not see in the list above is that same event happening again. Decide it, and write the    │
  # │ decision down: require it, or record here why it must not be.                                    │
  # └──────────────────────────────────────────────────────────────────────────────────────────────────┘
  #
  # `prepublish` is the pre-publish gate: it refuses a dependency specifier no registry can resolve
  # (offline manifest lint) and then packs this tree and installs the tarball into a clean directory.
  # Both layers are ON by default upstream and this caller passes neither toggle, so the defaults are
  # the whole story for whether it runs. It is the only place a consumer's install question gets
  # asked while the answer can still prevent a permanent publish: `@cosyte/cli@0.0.1` and `0.0.2` are
  # on the registry uninstallable forever, and this job is what would have refused them.
  #
  # ONE DEFAULT IS PERMANENTLY STALE HERE, AND THE OBVIOUS "FIX" FOR IT IS FORBIDDEN. The upstream
  # default for `expect-unpublished-deps` is `@cosyte/fhir=blocked`. Be precise about why that is
  # stale, because the short version is false: `@cosyte/fhir` IS declared in this manifest, as
  # `devDependencies: {"@cosyte/fhir": "^0.1.0"}`, a registry range, which is what lets this
  # repo's own FHIR tests run. The operative fact is that `prepublish-check.mjs` does not read
  # `devDependencies` at all (a `file:` specifier is fine there, since no consumer installs them), so
  # the allowance names a package that is not a CONSUMER dependency of this one and is reported stale
  # on every run. That notice never fails the job.
  #
  # It must NOT be silenced by promoting `@cosyte/fhir` into `dependencies` or `optionalDependencies`:
  # declaring it in either, alongside `@cosyte/transform`, fails the whole install with `ERESOLVE`,
  # which is the measured reason it is not there. See CLAUDE.md. If the notice is ever worth
  # silencing, the way is to pass an empty `expect-unpublished-deps` from this caller.
  #
  # Universal gates from the shared pipeline (typecheck, lint, format, test, coverage, build, attw,
  # dual ESM/CJS smoke, actionlint) on the standard Node matrix. Repo-specific extra jobs (e.g. an
  # examples smoke, a starter-kit build) are added on top of this caller, never instead of it.
  # The shared pipeline's optional PHI-scan step is switched on: `pnpm phi-scan` runs the shared
  # scanner, `cosyte-phi-scan` from @cosyte/script-utils (ST34), over the whole repository. It is the
  # cross-cutting floor (dashed SSN shapes and emails at undeclared domains); this package parses no
  # wire format itself, so it carries no field-level detectors of its own.
  #
  # THE NODE MATRIX IS DECLARED HERE, DELIBERATELY, AND ITS VALUES ARE NOT FREE TO CHANGE.
  # `node-versions` has an upstream default, and passing it explicitly is the point: the set this
  # repo is tested on is a fact stated in this repository, readable without resolving the called
  # workflow's input defaults, and diffable when it moves. `package.json`'s `engines.node` range and
  # the support lines in README.md, docs-content/installation.md and CLAUDE.md are bound to this
  # list, and `test/node-support.test.ts` fails the build when any of them disagree.
  #
  # EACH VALUE IS A STATUS-CHECK CONTEXT. The matrix cell `22` produces
  # `ci / verify (22, ubuntu-latest)` and `24` produces `ci / verify (24, ubuntu-latest)`; both are
  # named in the `ci-required-checks` ruleset with `bypass_actors: []`. `26` was added on 2026-11-07
  # under the operator's Node standard (ST15), with `engines.node` opened to `>=22.0.0` in the same
  # change, once the suite passed on Node 26. Its context, `ci / verify (26, ubuntu-latest)`, runs on
  # every pull request and is NOT required yet: until the ruleset names it, a red Node 26 leg blocks
  # nothing, so read it on every pull request. Removing or renaming a value
  # stops its context being emitted, and a required context nothing emits is PENDING rather than
  # failing: every pull request, including the one that would undo it, becomes unmergeable by
  # anyone, admin included. Nothing in this repository can edit that ruleset; it is a GitHub setting
  # a human with repo admin changes.
  #
  # SO THE ORDER IS RULESET FIRST, MATRIX SECOND, RANGE THIRD, and Node 26 is the one recorded
  # exception. Adding a line without adding its context to the ruleset first gets a context that
  # arrives NOT REQUIRED: a red X that blocks nothing, which is the appearance of a gate rather
  # than a gate.
  # That has happened here for real once (`prepublish`, 2026-08-05, see the banner above). Dropping
  # a line without removing its context first is the worse direction and bricks the branch.
  ci:
    uses: cosyte/.github/.github/workflows/ci.yml@498c7c13c8869bf11b67fa8324684ec2dc691ec6 # workflows-2026-11-07-498c7c13c886
    with:
      run-phi-scan: true
      node-versions: '["22", "24", "26"]'

  # The runnable examples under examples/: each one runs the built `cosyte` executable, found
  # through `@cosyte/cli/package.json` resolved by this package's own `exports`, on the synthetic
  # fixtures under test/__fixtures__, and checks the exit code and the output. `pnpm examples` fails
  # if any example does, or if it finds none to run. This job is not one of the required contexts
  # in the banner above. Actions are pinned to a commit.
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck:examples
      - run: pnpm lint:examples
      - run: pnpm examples
      - run: pnpm phi-scan:examples

  # The house checks on this repository's documents and its catalog entry, from @cosyte/script-utils
  # (RD1, RD2, PF1): the README against the house skeleton and npm's size limit
  # (`pnpm check:readme`), the CLAUDE.md card against its spec (`pnpm check:claude-card`), and the
  # package description against the catalog that ships in script-utils (`pnpm check:catalog`). This
  # job is not one of the required contexts in the banner above.
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The README follows the house skeleton
        run: pnpm check:readme
      - name: The CLAUDE.md card follows its spec
        run: pnpm check:claude-card
      - name: The package description is the catalog's
        run: pnpm check:catalog
